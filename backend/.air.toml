root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Go build command — 不使用 -tags embed 以便纯后端开发
  cmd = "go build -o ./tmp/server.exe ./cmd/server"
  # 二进制文件及参数（推荐方式，替代已弃用的 bin）
  entrypoint = ["./tmp/server.exe"]
  # 排除文件变更后自动触发编译
  exclude_regex = ["_test\\.go$"]
  # 监听文件后缀
  include_ext = ["go", "toml", "yaml", "json", "mod", "sum"]
  # 监听的目录（逗号分隔，相对于 root）
  include_dir = ["cmd", "internal", "ent"]
  # 排除的目录（生成代码/前端产物，不需要监听）
  exclude_dir = ["tmp", "vendor", "testdata", "migrations", "resources", "internal/web/dist"]
  # 延迟执行（毫秒），累积文件变更后统一触发
  delay = 500
  # 编译错误日志
  log = "build-errors.log"
  # 编译失败时不停止旧进程
  stop_on_error = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # 退出时清理 tmp 目录
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scrollback = true
